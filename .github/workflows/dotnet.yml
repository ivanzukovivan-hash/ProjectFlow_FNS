name: .NET CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore ProjectFlow_FNS.sln

    - name: Build solution
      run: msbuild ProjectFlow_FNS.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Run tests with dotnet test
      run: dotnet test ProjectFlow_FNS.Tests/ProjectFlow_FNS.Tests.csproj --no-build --configuration Release --logger:trx --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/
